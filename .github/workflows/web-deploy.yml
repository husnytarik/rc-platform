name: Web paneli (GitHub Pages)

# Mobil uygulamanın web sürümü: aynı ekranlar, tarayıcıdan. Linux runner — macOS'un
# aksine dakika çarpanı yok, public repoda ücretsiz.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm etkinleştir
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: '@rc/shared paketini derle'
        run: pnpm --filter @rc/shared run build

      - name: Web derle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          WEB_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web
          # SPA: bilinmeyen yolları index.html'e düşür (Pages 404.html'i kullanır)
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
