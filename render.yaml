# Render Blueprint — API'yi Neon'a bağlı tek web servisi olarak dağıtır.
# Kullanım: Render Dashboard → New → Blueprint → bu repoyu seç.
# `sync: false` olan değişkenleri Render panelinden elle gir (buraya sır yazılmaz).
services:
  - type: web
    name: rc-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @rc/shared run build && pnpm --filter @rc/api run prisma:generate && pnpm --filter @rc/api run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "75"
      - key: GOOGLE_MOBILE_CLIENT_ID
        sync: false
      - key: GOOGLE_ADMIN_CLIENT_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.husnytarik.roasteryclub
      - key: ADMIN_URL
        sync: false
