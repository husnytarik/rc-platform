# Render Blueprint — API'yi Neon'a bağlı tek web servisi olarak dağıtır.
# Kullanım: Render Dashboard → New → Blueprint → bu repoyu seç.
# `sync: false` olan değişkenleri Render panelinden elle gir (buraya sır yazılmaz).
services:
  - type: web
    name: rc-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @rc/shared run build && pnpm --filter @rc/api run prisma:generate && pnpm --filter @rc/api exec prisma migrate deploy && pnpm --filter @rc/api run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "75"
      # SMS ile giriş (Netgsm). Üçü birlikte tanımlanmalı; yoksa üretimde kod gönderilemez.
      - key: NETGSM_USERCODE
        sync: false
      - key: NETGSM_PASSWORD
        sync: false
      - key: NETGSM_HEADER
        sync: false
      # İlk yönetici(ler): virgülle ayrılmış telefonlar (+905xxxxxxxxx). Bu numara SMS ile girince üretici yöneticisi olur.
      - key: ADMIN_PHONES
        sync: false
      # Netgsm yokken geçici mod: "true" → müşteri kodu uygulamaya döner (SMS gitmez). Netgsm tanımlanınca otomatik kapanır.
      - key: SMS_MOCK
        sync: false
      # Mock modunda yönetici numarasının girişi için şifre (>=8 karakter).
      - key: ADMIN_PASSWORD
        sync: false
      # TC özetleri için ayrı sır (>=16 karakter). Boşsa JWT_REFRESH_SECRET kullanılır; sonradan değiştirmeyin.
      - key: TC_HASH_SECRET
        sync: false
      # Günlük toplam SMS tavanı (fatura koruması). Boşsa 200.
      - key: OTP_DAILY_CAP
        value: "200"
      - key: DEMO_ADMIN_CODE
        sync: false
      - key: DEMO_CUSTOMER_CODE
        sync: false
      - key: WEB_URL
        sync: false
      - key: ADMIN_URL
        sync: false
